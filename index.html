;],&quot;generated&quot;:[0,&quot;2026-10-16&quot;],&quot;note&quot;:[0,&quot;Merged from four verified research files (2026-10-16); &#39;unverified&#39; and &#39;(fetch failed)&#39; notes are kept inside field text. Coordinates, images and OSM hours from scripts/sights_enrich.py.&quot;],&quot;total_sights&quot;:[0,155],&quot;sources&quot;:[1,[[0,&quot;museums_architecture.md&quot;],[0,&quot;food_drink_markets.md&quot;],[0,&quot;day_trips.md&quot;],[0,&quot;history_parks_hidden_gems.md&quot;]]],&quot;history&quot;:[0,{&quot;paragraphs&quot;:[1,[[0,&quot;The Taurini were a Celto-Ligurian people of the upper Po valley; Hannibal is reported to have taken their main settlement, Taurasia, in 218 BC. The Romans founded the colony of Augusta Taurinorum in the 1st century BC, probably after 28 BC, as a walled military camp on a regular grid. That grid survives in the Quadrilatero Romano, and the best-preserved piece of the walls is the Porta Palatina, a double-arched gate with two sixteen-sided towers, still standing beside the cathedral gardens.&quot;],[0,&quot;After the Western Empire collapsed, Turin passed to the Ostrogoths and then, in the late 6th century, to the Lombards, whose kingdom held the area from 569 to 773. A Duke of Turin, Agilulf, became king of the Lombards around 590. Charlemagne&#39;s Franks took the city in 773-774 and made it a county seat. In the Middle Ages power shifted to the Counts, later Dukes, of Savoy, who held the Alpine passes and gradually extended their lands on both sides of the Alps.&quot;],[0,&quot;In 1563 Duke Emanuele Filiberto, who had recovered his duchy through the 1559 Treaty of Cateau-Cambresis, moved the Savoy capital from Chambery to Turin, a safer position on the Italian side of the Alps. In 1578 he also brought the Holy Shroud from Chambery to Turin; it has stayed there since. The city became a planned dynastic capital: the Citadel, Piazza Castello and the royal residences followed, then the 17th-century extensions along Via Po (arcades by Amedeo di Castellamonte, 1674) and the Baroque works of Guarino Guarini, whose Chapel of the Holy Shroud was built 1668-1694, and Filippo Juvarra, who redesigned much of the city after 1713 and built the Basilica of Superga (from 1717) and the Stupinigi hunting lodge.&quot;],[0,&quot;The Franco-Spanish siege of 1706 lasted 117 days. On the night of 29-30 August the soldier Pietro Micca blew up a mine gallery under the Citadel to stop French grenadiers entering the lower tunnels, and died in the blast; the city was relieved on 7 September by Prince Eugene of Savoy and Duke Victor Amadeus II. The Treaty of Utrecht (1713) made the Duke of Savoy king, first of Sicily and, after 1720, of Sardinia. Napoleon annexed Piedmont in 1802-1814; the Savoy returned, and the Risorgimento was planned from Turin under Cavour. Turin was the first capital of unified Italy from 1861 to 1865, until the seat moved to Florence and then Rome, leaving the city with a large empty administrative apparatus and an economic crisis.&quot;],[0,&quot;Industry replaced the court. The Fiat company was founded in Turin in 1899. The Lingotto plant, with its rooftop test track, was built in 1916-1923, and Mirafiori opened in 1939. Between the 1950s and 1960s waves of migrants from southern Italy raised the population to one million in 1960 and almost 1.2 million in 1971; Turin became the largest \&quot;southern\&quot; city in the north, with housing shortages and the labour conflicts of the 1960s and 1970s. Allied bombing in 1942-1943 damaged the centre. The Fiat crisis of the 1980s and 1990s and plant closures left empty factory land.&quot;],[0,&quot;Reinvention began in the 1990s: the Spina Centrale railway trench and new Porta Susa station, the Lingotto turned into a conference, hotel and gallery complex by Renzo Piano, and the 2006 Winter Olympics, which brought new infrastructure, the first metro line and international attention. Former industrial sites became Parco Dora and the Mirafiori campus; the Egyptian Museum, Cinema Museum and Royal Museums were renovated. The city proper has about 855,000 residents (2026 figure on English Wikipedia).&quot;],[0,&quot;Turin also has a popular reputation as a city of magic. The legend says it sits at one point of a \&quot;black magic\&quot; triangle with London and San Francisco, and of a \&quot;white magic\&quot; triangle with Prague and Lyon. Piazza Statuto, a Roman-era execution and burial area, is described as the apex of the negative triangle, and the Frejus Tunnel monument (1879), a pile of Titans topped by a winged genius, is read in esoteric tracts as a gate of hell with Lucifer on top. The official reading is Reason triumphing over brute force, in memory of the tunnel workers. None of this has primary historical evidence; it is a 20th-century occult tradition. The Shroud is documented from the 1350s at Lirey in France, bought by the Savoy in 1453, damaged in a Chambery fire in 1532, and moved to Turin in 1578. Radiocarbon dating in 1988 gave about 1260-1390 AD, a finding still disputed by believers, and a fire in 1997 threatened the chapel where it was kept.&quot;]]],&quot;sources&quot;:[1,[[0,&quot;https://en.wikipedia.org/wiki/History_of_Turin&quot;],[0,&quot;https://en.wikipedia.org/wiki/Pietro_Micca&quot;],[0,&quot;https://en.wikipedia.org/wiki/Turin_Shroud&quot;],[0,&quot;https://en.wikipedia.org/wiki/Turin&quot;],[0,&quot;https://www.guidatorino.com/?p=1728&quot;],[0,&quot;https://siviaggia.it/posti-incredibili/misteri-torino-citta-magia-nera-bianca/359591/&quot;]]],&quot;sources_note&quot;:[0,&quot;https://en.wikipedia.org/wiki/History_of_Turin ; https://en.wikipedia.org/wiki/Pietro_Micca ; https://en.wikipedia.org/wiki/Turin_Shroud ; https://en.wikipedia.org/wiki/Turin ; https://www.guidatorino.com/?p=1728 and https://siviaggia.it/posti-incredibili/misteri-torino-citta-magia-nera-bianca/359591/ (esoteric lore, via search summaries; treat as folklore). Details not in the fetched pages (Agilulf, Charlemagne, Juvarra&#39;s dates, Lingotto 1916-23, Mirafiori 1939, Frejus monument 1879, Napoleonic annexation, 7 September relief) come from general knowledge and should be spot-checked.&quot;]}]}],&quot;sights&quot;:[1,[[0,{&quot;name&quot;:[0,&quot;Museo Egizio (Egyptian Museum)&quot;],&quot;type&quot;:[0,&quot;Archaeological / Egyptological Museum&quot;],&quot;category&quot;:[0,&quot;museum&quot;],&quot;area&quot;:[0,&quot;Turin&quot;],&quot;neighborhood&quot;:[0,&quot;Centro&quot;],&quot;priority&quot;:[0,&quot;must-see&quot;],&quot;address&quot;:[0,&quot;Via Accademia delle Scienze 6, 10123 Torino&quot;],&quot;opening_hours&quot;:[0,&quot;Official (museoegizio.it/en/info/hours, read 2026-10-16): Monday 9:00-14:00; Tuesday-Friday and Sunday 9:00-18:30; Saturday 9:00-20:00; last entry one hour before closing; tickets sold online only. Special openings listed: Fri 30 and Sat 31 October 2026 9:00-22:00. The page shows a conflicting line for Sat 17 October 2026 (9:00-12:00 vs \&quot;until midnight\&quot;), so check before going. No weekly closing day. The Historic Rooms on floor -1 have been closed since 12 December 2025 with no reopening date given (official notice); the museum&#39;s 2026 budget note (secondary) mentions works finishing around November 2026.&quot;],&quot;price&quot;:[0,&quot;Adult EUR 18 (Turismo Torino listing; the official museoegizio.it/en/info/prices page shows the fares only as an image, so the amount is not readable there; read 2026-10-16). Over 70 and accredited journalists EUR 15, family (2 adults + 2 minors) EUR 36 (Turismo Torino via search summary). Official page: school groups EUR 1 per student (ages 6-14) and EUR 3 (high school); free up to age 5, disability plus companion, ICOM members, Turin Museum Card. Entry is only with a pre-booked online ticket, including free ones. Torino+Piemonte Card holders enter free (official prices page; an older guide shows EUR 13 full price and a 2024 listing EUR 14, both out of date). Not state-run, so the national free first Sunday is not confirmed to apply.&quot;],&quot;visit_duration_minutes&quot;:[0,180],&quot;booking_required&quot;:[0,true],&quot;booking_notes&quot;:[0,&quot;Only online tickets are accepted at the door (egizio.museitorino.it); book days ahead for Saturdays and holiday periods. Phone 011 44 06 903, info@museitorino.it.&quot;],&quot;architectural_style&quot;:[1,[[0,&quot;Baroque (Palazzo dell&#39;Accademia delle Scienze by Guarino Guarini, 1679)&quot;],[0,&quot;modern museum fit-out by Dante Ferretti (2015)&quot;]]],&quot;unesco&quot;:[0,false],&quot;why_visit&quot;:[0,&quot;The largest collection of Egyptian antiquities outside Cairo, around 40,000 objects. Highlights are the Tomb of Kha and Merit (intact, with its furniture and food), the Statue of Ramesses II, the Gallery of the Kings statues, the Book of the Dead of Iufaa and the Deir el-Medina papyri including the Turin Kings List.&quot;],&quot;historical_context&quot;:[0,&quot;Founded 1824 when Charles Felix of Savoy bought the Drovetti collection (about 5,000 pieces). Ernesto Schiaparelli&#39;s excavations 1903-1920 added the Kha tomb (1906). Champollion studied the collection here in 1824 and called Turin the \&quot;Cairo of the north\&quot; in a later tradition. Reopened in 2015 after a major renovation.&quot;],&quot;tips&quot;:[0,&quot;Take the audio guide or a guided tour; the museum is dense. Weekday late afternoon and Saturday evening are quieter. Allow time for the statue gallery on the ground floor, which is the museum&#39;s showpiece. Check that the Historic Rooms closure does not remove what you came for.&quot;],&quot;nearby_food&quot;:[1,[[0,&quot;Caffe Mulassano (Piazza Castello)&quot;],[0,&quot;Pastificio De Filippis (Via Lagrange)&quot;],[0,&quot;Ristorante Del Cambio&quot;]]],&quot;sources&quot;:[1,[[0,&quot;https://www.museoegizio.it/en/info/hours/&quot;],[0,&quot;https://www.museoegizio.it/en/&quot;],[0,&quot;https://www.museoegizio.it/en/tickets-shop/&quot;],[0,&quot;https://www.museoegizio.it/en/explore/news/notice-closure-of-the-historic-rooms/&quot;],[0,&quot;https://www.guidatorino.com/museo-egizio-di-torino-orari-giorni-di-apertura-prezzi-e-riduzioni&quot;],[0,&quot;https://www.museoegizio.it/en/info/prices/&quot;],[0,&quot;https://turismotorino.org/en/visit/things-to-do-and-things-to-see/museums-and-heritage/museo-egizio&quot;]]],&quot;wikipedia_title&quot;:[0,&quot;Museo Egizio&quot;],&quot;website&quot;:[0,&quot;https://www.museoegizio.it/en/&quot;],&quot;image_url&quot;:[0,&quot;https://upload.wikimedia.org/wikipedia/commons/7/76/Museo_Egizio_e_Galleria_sabauda%2C_Torino.jpg&quot;],&quot;thumbnail_url&quot;:[0,&quot;https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Museo_Egizio_e_Galleria_sabauda%2C_Torino.jpg/330px-Museo_Egizio_e_Galleria_sabauda%2C_Torino.jpg&quot;],&quot;latitude&quot;:[0,45.06833333],&quot;longitude&quot;:[0,7.68444444],&quot;summary&quot;:[0,&quot;The largest Egyptian collection outside Cairo, about 40,000 objects. Highlights are the intact Tomb of Kha and Merit, the Ramesses II statue, the Gallery of the Kings and the Turin Kings List papyrus.&quot;],&quot;price_short&quot;:[0,&quot;€18&quot;],&quot;hours_short&quot;:[0,&quot;Mon 9–14, Tue–Sun 9–18:30 (Sat to 20)&quot;],&quot;pronunciations&quot;:[0,{&quot;Museo Egizio&quot;:[0,&quot;moo-ZEH-oh eh-JEE-tsyoh&quot;],&quot;Centro&quot;:[0,&quot;CHEN-troh&quot;]}]}],[0,{&quot;name&quot;:[0,&quot;Mole Antonelliana and Panoramic Lift&quot;],&quot;type&quot;:[0,&quot;Landmark Tower / Viewpoint&quot;],&quot;category&quot;:[0,&quot;viewpoint&quot;],&quot;area&quot;:[0,&quot;Turin&quot;],&quot;neighborhood&quot;:[0,&quot;Centro (Vanchiglia edge)&quot;],&quot;priority&quot;:[0,&quot;must-see&quot;],&quot;address&quot;:[0,&quot;Via Montebello 20, 10124 Torino&quot;],&quot;opening_hours&quot;:[0,&quot;Official (museocinema.it, 2026): Monday and Wednesday-Sunday 9:00-19:00, closed Tuesday; lift last ride 10 minutes before closing; ticket office closes one hour before. 20 November-11 January extended to 21:00. 24 and 31 December 9:00-18:00; 25 December and 1 January 14:00-21:00. Closed Wednesday 28 October 2026; 11-18 November 2026 only the ground floor is open (so the lift is likely out). Note: the home page says \&quot;daily\&quot;; the dedicated hours page says closed Tuesday.&quot;],&quot;price&quot;:[0,&quot;Panoramic Lift EUR 9 (EUR 7 for ages 6-26, Torino+Piemonte Card, Royal Pass, Abbonamento Musei); Museum EUR 18 (EUR 16 reduced); Museum + Lift EUR 23 (EUR 20 reduced). Under 6 free. Torino+Piemonte Card gives the museum free and a lift discount. Cupola Ascent EUR 15 guided / EUR 12 supervised. From 7 October to 9 November the museum-only price is reduced for all (amount not stated). Limited extra lift tickets are released online 19 hours before the chosen date.&quot;],&quot;visit_duration_minutes&quot;:[0,45],&quot;booking_required&quot;:[0,false],&quot;booking_notes&quot;:[0,&quot;Booking recommended. Lift queues are long in good weather; buy a timed ticket online at cinema.museitorino.it.&quot;],&quot;architectural_style&quot;:[1,[[0,&quot;Eclecticism&quot;],[0,&quot;19th-century engineering&quot;]]],&quot;unesco&quot;:[0,false],&quot;why_visit&quot;:[0,&quot;Turin&#39;s symbol, a 167 m brick-and-iron tower with a glass lift that rises through the open interior of the dome to a terrace at about 85 m. It gives the best central view of the city and the Alps. The lift is the main reason to come if you do not want the full cinema museum.&quot;],&quot;historical_context&quot;:[0,&quot;Begun in 1863 by Alessandro Antonelli as a synagogue for the Jewish community, which could not afford the growing cost. The city bought it and it was finished in 1889 by his son Costanzo; at the time it was the tallest brick building in Europe. A 1953 storm toppled the spire, rebuilt in steel.&quot;],&quot;tips&quot;:[0,&quot;Go on a clear day, early or just before closing. The Cupola Ascent (stairs outside the dome) is wea ;],&quot;opening_hours&quot;:[0,&quot;Same as the Mole entry (official): Monday and Wednesday-Sunday 9:00-19:00, closed Tuesday; Closed 28 October 2026; 11-18 November 2026 ground floor only (exhibition set-up).&quot;],&quot;price&quot;:[0,&quot;EUR 18 adult, EUR 16 reduced (ages 6-26, Royal Pass, FAI, Touring Club); Museum + Lift EUR 23; free with Torino+Piemonte Card, Abbonamento Musei, ICOM. See the Mole entry for lift and combined prices.&quot;],&quot;visit_duration_minutes&quot;:[0,120],&quot;booking_required&quot;:[0,false],&quot;booking_notes&quot;:[0,&quot;Booking recommended. Timed online tickets avoid queues.&quot;],&quot;architectural_style&quot;:[1,[[0,&quot;Eclecticism&quot;]]],&quot;unesco&quot;:[0,false],&quot;why_visit&quot;:[0,&quot;One of the best film museums in the world, laid out as a spiral ramp through the Mole&#39;s 85 m central hall under the dome, with reclining seats facing a huge screen. It covers optical toys, magic lanterns, the Lumiere brothers and film sets, and links to Turin&#39;s role as Italy&#39;s early film capital.&quot;],&quot;historical_context&quot;:[0,&quot;Founded 1941 by Maria Adriana Prolo and moved into the Mole in 2000 after a redesign by the Swiss designer Francois Confino. Turin&#39;s Itala Film and Ambrosio produced the 1914 epic Cabiria, the first big Italian blockbuster, here.&quot;],&quot;tips&quot;:[0,&quot;Use the lift for the view first, then the museum. Temporary exhibition prices are sometimes separate (a Nov 2026 exhibition is listed at EUR 3 while the building is partly closed).&quot;],&quot;nearby_food&quot;:[1,[[0,&quot;Tonic Restaurant (Via Po)&quot;],[0,&quot;Caffe Elena&quot;],[0,&quot;Gelateria Alberto Marchetti&quot;]]],&quot;sources&quot;:[1,[[0,&quot;https://www.museocinema.it/en&quot;],[0,&quot;https://www.museocinema.it/en/plan-your-visit/ticket-prices&quot;],[0,&quot;https://www.museocinema.it/en/plan-your-visit/opening-hours-museo-nazionale-del-cinema&quot;]]],&quot;wikipedia_title&quot;:[0,&q n (Pista 500). The Pinacoteca shows the Agnelli family&#39;s small collection (Canaletto, Matisse, Picasso, Renoir, Modigliani) in a box above the track.&quot;],&quot;price_short&quot;:[0,&quot;€12 combined&quot;],&quot;hours_short&quot;:[0,&quot;Tue–Sun 10–19 (10–18 from 29 Oct), closed Mon&quot;],&quot;pronunciations&quot;:[0,{&quot;Pinacoteca Agnelli&quot;:[0,&quot;pee-nah-koh-TEH-kah an-NYEL-lee&quot;],&quot;La Pista 500&quot;:[0,&quot;lah PEE-stah cheen-kweh-CHEN-toh&quot;],&quot;Lingotto&quot;:[0,&quot;leen-GOT-toh&quot;]}]}],[0,{&quot;name&quot;:[0,&quot;Castello del Valentino and Parco del Valentino&quot;],&quot;type&quot;:[0,&quot;Royal Castle / Riverside Park&quot;],&quot;category&quot;:[0,&quot;park&quot;],&quot;area&quot;:[0,&quot;Turin&quot;],&quot;neighborhood&quot;:[0,&quot;San Salvario / Crocetta (along the Po)&quot;],&quot;priority&quot;:[0,&quot;highly-recommended&quot;],&quot;address&quot;:[0,&quot;Viale Mattioli 39, 10125 Torino (castle); Parco del Valentino along Corso Massimo d&#39;Azeglio&quot;],&quot;opening_hours&quot;:[0,&quot;Park open all hours (public park). The castle belongs to the Politecnico di Torino; the public can enter only on free guided visits of the piano nobile (about 1 hour) with mandatory online booking. 2026 (GuidaTorino citing the Politecnico): Saturday mornings in June and July, then 5-26 September 2026 10:00-12:00; no October-December dates found, so check the booking calendar.&quot;],&quot;price&quot;:[0,&quot;Park free. Castle guided visits free (GuidaTorino listing of the Politecnico visits).&quot;],&quot;visit_duration_minutes&quot;:[0,90],&quot;booking_required&quot;:[0,false],&quot;booking_notes&quot;:[0,&quot;Booking recommended. Castle visits need an online booking in the Politecnico calendar (castellodelvalentino.polito.it/?page_id=5194); children up to 12 enter with a booked adult (max two minors per adult); latecomers are refused.&quot;],&quot;architectural_style&quot;:[1,[[0,&quot;French-inspired Baroque (ca [0,&quot;Begun in 1675 by Amedeo di Castellamonte for Carlo Emanuele II, damaged by the French in 1693, and expanded by Juvarra from 1716 under Vittorio Amedeo II. It decayed in the 19th-20th centuries and reopened in 2007 after one of Europe&#39;s largest restorations. It is part of the Residences of the Royal House of Savoy UNESCO site (1997).&quot;],&quot;tips&quot;:[0,&quot;PUBLIC TRANSPORT: GTT bus 11 (from Porta Nuova side) and bus 72 (from Porta Susa side) plus the VE1 line reach Venaria in about 30-40 min on a standard urban ticket (about 2 EUR); the official site lists 11, VE1 and 72. The Venaria Express shuttle (GTT, Tue-Sun) runs from the centre directly to the Reggia/Mandria. By train the official site lists SFM lines SFM4, SFM6 and SFM7 to the stop \&quot;Reggia di Venaria\&quot; on viale Roma, then about 500 m on foot (another source says SFM A / Torino-Ceres, check the SFM timetable). BY CAR: Tangenziale Nord, exit Venaria/Savonera, car parks Castellamonte (A) and Carlo Emanuele II (B), about 20 min from the centre. Pair with Parco La Mandria next door.&quot;],&quot;nearby_food&quot;:[1,[[0,&quot;Caffe Reale inside the Reggia&quot;],[0,&quot;Borgo Antico restaurants in Venaria old town&quot;],[0,&quot;La Mandria visitor-area cafés&quot;]]],&quot;sources&quot;:[1,[[0,&quot;https://www.lavenaria.it/en&quot;],[0,&quot;https://lavenaria.it/en/visit/tickets-and-reservations&quot;],[0,&quot;https://lavenaria.it/en/visit-la-reggia-di-venaria/opening-hours/&quot;],[0,&quot;https://lavenaria.it/en/visit-la-reggia-di-venaria/tickets-and-reservations/reggia-gardens-castle-of-la-mandria/&quot;],[0,&quot;https://www.idealista.it/news/node/176663&quot;],[0,&quot;https://lavenaria.it/en/visit-la-reggia-di-venaria/how-to-get-there/&quot;]]],&quot;wikipedia_title&quot;:[0,&quot;Reggia di Venaria Reale&quot;],&quot;website&quot;:[0,&quot;https://www.lavenaria.it&quot;],&quot;image_url&quot;:[0,&quot;https://upload.wikimedia.org/wikipedia/commons/d/d8/Reggia_di_Venaria_
